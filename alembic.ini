
# Alembic database migration configuration

[alembic]

# Location of migration scripts
script_location = %(here)s/backend/migrations

# Add project root to Python path
prepend_sys_path = %(here)s

# Path separator
path_separator = os

# Migration file encoding
output_encoding = utf-8

# Database URL
# Actual database connection is configured in app/database/database.py
sqlalchemy.url = driver://user:pass@localhost/dbname


# Post-write hooks
[post_write_hooks]


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


# Root logger
[logger_root]
level = WARNING
handlers = console
qualname =


# SQLAlchemy logger
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


# Alembic logger
[logger_alembic]
level = INFO
handlers =
qualname = alembic


# Console handler
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# Log formatter
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
